apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-cm
  
data:
  username: 'otus-project'
  url: 'jdbc:postgresql://delivery-postgresql.default.svc.cluster.local:5432/postgres?prepareThreshold=0'
  applicationName: 'delivery'
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  
spec:
  selector:
    app: delivery
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-deployment
  
  labels:
    app: delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      containers:
        - name: delivery
          image: olegmeditskiy96/otus-final-delivery:1.0
          ports:
            - containerPort: 8000
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: '8000'
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: delivery-cm
                  key: username
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: delivery-cm
                  key: url
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: delivery-cm
                  key: applicationName
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otus-homework-secret
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cm
                  key: kafka-host
          volumeMounts:
            - name: config
              mountPath: "/config"
              readOnly: true
      volumes:
        - name: config