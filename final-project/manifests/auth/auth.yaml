apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-cm
  
data:
  username: 'otus-project'
  url: 'jdbc:postgresql://auth-postgresql:5432/postgres?prepareThreshold=0'
  applicationName: 'auth'
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      name: http-traffic
      port: 80
      targetPort: 8000

  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-boot-app-service-monitor
spec:
  selector:
    matchLabels:
      app: auth
  endpoints:
    - port: http-traffic
      path: "/actuator/prometheus"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: olegmeditskiy96/otus-final-auth:1.1
          ports:
            - containerPort: 8000
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: '8000'
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: auth-cm
                  key: username
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-cm
                  key: url
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: auth-cm
                  key: applicationName
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otus-homework-secret
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cm
                  key: kafka-host
          volumeMounts:
            - name: config
              mountPath: "/config"
              readOnly: true
      volumes:
        - name: config