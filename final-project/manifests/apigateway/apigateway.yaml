apiVersion: v1
kind: ConfigMap
metadata:
  name: apigateway-cm
  
data:
  ORDER_SERVICE_URL: http://order-service:80
  BILLING_SERVICE_URL: http://billing-service:80
  BASE_AUTH_SERVICE_URL: http://auth-service:80
  AUTH_SERVICE_URL: http://auth-service
  AUTH_SERVICE_PORT: '80'
  NOTIFICATION_SERVICE_URL: http://notification-service:80
  DELIVERY_SERVICE_URL: http://delivery-service:80
  STOCK_SERVICE_URL: http://stock-service:80
  applicationName: 'auth'
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  
spec:
  selector:
    app: apigateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: olegmeditskiy96/otus-final-apigateway:1.0
          ports:
            - containerPort: 8000
          env:
            - name: UPSTREAM_BASE_ORDER_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: ORDER_SERVICE_URL
            - name: UPSTREAM_BASE_AUTH_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: BASE_AUTH_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: AUTH_SERVICE_URL
            - name: AUTH_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: AUTH_SERVICE_PORT
            - name: UPSTREAM_BASE_BILLING_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: BILLING_SERVICE_URL
            - name: UPSTREAM_BASE_NOTIFICATION_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: NOTIFICATION_SERVICE_URL
            - name: UPSTREAM_BASE_DELIVERY_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: DELIVERY_SERVICE_URL
            - name: UPSTREAM_BASE_STOCK_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: apigateway-cm
                  key: STOCK_SERVICE_URL
          volumeMounts:
            - name: config
              mountPath: "/config"
              readOnly: true
      volumes:
        - name: config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apigateway-ingress
  
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /()(.*)
            pathType: Prefix
            backend:
              service:
                name: apigateway-service
                port:
                  number: 80
